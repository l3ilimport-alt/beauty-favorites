<title>קטלוג ביוטי פייבוריטס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Heebo:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#f7f2ea; --band:#efe7db; --card:#ffffff; --soft:#fff8ef;
  --line:#e9e3d9; --edge:#dcd3c4;
  --ink:#2a2420; --mut:#6e6358;
  --bronze:#b98e68; --accent:#8c5a38;
  --ok:#1f7a4d; --okbg:#e6f2ea; --low:#a06a12; --lowbg:#fbf1de;
  --shadow:0 8px 26px rgba(140,90,56,.11);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171310; --band:#1f1a15; --card:#211b16; --soft:#251e18;
    --line:#332a22; --edge:#3d3228;
    --ink:#f2ebe2; --mut:#a89684;
    --bronze:#c9a077; --accent:#dfb489;
    --ok:#5fbf8c; --okbg:#16281f; --low:#d9a341; --lowbg:#2b2114;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#171310; --band:#1f1a15; --card:#211b16; --soft:#251e18;
  --line:#332a22; --edge:#3d3228;
  --ink:#f2ebe2; --mut:#a89684;
  --bronze:#c9a077; --accent:#dfb489;
  --ok:#5fbf8c; --okbg:#16281f; --low:#d9a341; --lowbg:#2b2114;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:Heebo,-apple-system,"Segoe UI",system-ui,sans-serif;line-height:1.65;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header{padding:22px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.eyebrow{font-size:10.5px;letter-spacing:3.4px;color:var(--accent);text-transform:uppercase;
  margin-bottom:7px;font-weight:500}
h1{margin:0;font-size:clamp(22px,3.2vw,31px);letter-spacing:.2px;line-height:1.15}
.when{color:var(--mut);font-size:13px;font-style:italic;font-family:"Playfair Display",Georgia,serif;margin-top:5px}

.modes{display:flex;gap:0;border:1px solid var(--bronze);border-radius:40px;overflow:hidden;flex:0 0 auto}
.modes button{background:transparent;color:var(--accent);border:0;padding:10px 20px;
  font:inherit;font-size:13px;letter-spacing:.6px;cursor:pointer;transition:background .15s,color .15s}
.modes button[aria-pressed="true"]{background:var(--bronze);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,50%),1fr));
  background:var(--band);border-bottom:1px solid var(--edge)}
.kpi{padding:16px 12px;text-align:center;border-inline-start:1px solid var(--edge)}
.kpi:first-child{border-inline-start:0}
.kpi b{display:block;font-size:26px;font-family:"Playfair Display",Georgia,serif;
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{display:block;color:var(--mut);font-size:10px;letter-spacing:1.7px;
  text-transform:uppercase;margin-top:6px}
.kpi.good b{color:var(--ok)}

.controls{max-width:1560px;margin:0 auto;padding:22px 26px 6px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border:1px solid var(--edge);border-radius:40px;
  background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;pointer-events:none}
select{padding:10px 14px;border:1px solid var(--edge);border-radius:40px;background:var(--card);
  color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--edge);color:var(--mut);
  padding:8px 16px;border-radius:40px;font:inherit;font-size:13px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--bronze);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip em{font-style:normal;opacity:.65;font-size:11.5px;margin-inline-start:5px;font-variant-numeric:tabular-nums}

.meta{color:var(--mut);font-size:13px;font-style:italic;font-family:"Playfair Display",Georgia,serif;
  border-bottom:1px solid var(--bronze);padding-bottom:12px}

main{max-width:1560px;margin:0 auto;padding:16px 26px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s,border-color .18s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--bronze)}
.imgwrap{height:180px;background:var(--soft);display:flex;align-items:center;justify-content:center;
  padding:18px 16px 12px;position:relative}
.imgwrap img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(36,31,25,.18))}
.tag{position:absolute;top:11px;inset-inline-start:11px;font-size:10.5px;letter-spacing:.8px;
  padding:4px 10px;border-radius:40px;font-weight:500}
.tag.low{background:var(--lowbg);color:var(--low)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.brand{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent);font-weight:500}
.name{font-family:"Playfair Display",Georgia,serif;font-size:15.5px;line-height:1.35;margin:0;font-weight:500}
.sub{font-size:12px;color:var(--mut)}
.foot{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.price{font-family:"Playfair Display",Georgia,serif;font-size:21px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.price small{font-size:12.5px;color:var(--mut);font-family:Heebo,sans-serif;margin-inline-start:3px}
.stock{font-size:11.5px;color:var(--ok);background:var(--okbg);padding:3px 10px;border-radius:40px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.stock.low{color:var(--low);background:var(--lowbg)}
.none{grid-column:1/-1;padding:40px;text-align:center;color:var(--mut);font-style:italic;
  font-family:"Playfair Display",Georgia,serif;background:var(--card);border:1px solid var(--line);border-radius:12px}
footer{border-top:1px solid var(--edge);background:var(--band);padding:24px 26px;color:var(--mut);font-size:12.5px}
footer b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){
  header{padding:18px}
  .controls,main{padding-inline:18px}
  .imgwrap{height:150px}
}
</style>

<header>
  <div>
    <div class="eyebrow">ביוטי פייבוריטס · קטלוג חי</div>

</footer>

;
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('he-IL');
const state = { q:'', cat:'', brand:'', sort:'stock', mode:'cons' };

$('#when').textContent = 'נשלף מהמסד · ' +
  new Date().toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});

/* פס המדדים — מתעדכן עם הסינון, כך שהמספרים תמיד מתארים את מה שרואים */
function kpis(list){
  const units = list.reduce((s,p)=>s+p.stock,0);
  const brands = new Set(list.map(p=>p.brand)).size;
  const value = list.reduce((s,p)=>s+p.stock*(state.mode==='cons'?p.cons:p.ws),0);
  const low = list.filter(p=>p.stock<=3).length;
  $('#kpis').innerHTML = [
    ['מוצרים', fmt(list.length), ''],
    ['יחידות במלאי', fmt(units), ''],
    ['מותגים', fmt(brands), ''],
    ['שווי המדף', '₪' + fmt(Math.round(value)), 'good'],
    ['נותרו 3 ומטה', fmt(low), low ? '' : 'good'],
  ].map(([l,v,c])=>`<div class="kpi ${c}"><b>${v}</b><span>${l}</span></div>`).join('');
}

function chips(){
  const counts = {};
  DATA.forEach(p => counts[p.cat] = (counts[p.cat]||0)+1);
  const cats = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  $('#cats').innerHTML =
    `<button class="chip" data-cat="" aria-pressed="true">הכל<em>${DATA.length}</em></button>` +
    cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="false">${c}<em>${counts[c]}</em></button>`).join('');
  $('#cats').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state.cat = b.dataset.cat;
    $('#cats').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    render();
  });
  const brands = [...new Set(DATA.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,'he'));
  $('#brand').insertAdjacentHTML('beforeend', brands.map(b=>`<option>${b}</option>`).join(''));
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  let list = DATA.filter(p=>{
    if(state.cat && p.cat !== state.cat) return false;
    if(state.brand && p.brand !== state.brand) return false;
    if(!q) return true;
    return (p.name+' '+p.en+' '+p.brand+' '+p.sku+' '+p.sub).toLowerCase().includes(q);
  });
  const price = p => state.mode==='cons' ? p.cons : p.ws;
  const by = {
    stock:(a,b)=>a.stock-b.stock,
    priceUp:(a,b)=>price(a)-price(b),
    priceDown:(a,b)=>price(b)-price(a),
    name:(a,b)=>a.name.localeCompare(b.name,'he'),
  }[state.sort];
  return list.sort(by);
}

function render(){
  const list = filtered();
  kpis(list);
  $('#meta').textContent = list.length
    ? `${fmt(list.length)} מוצרים · ${state.mode==='cons'?'מחיר לצרכן, כולל מע״מ':'מחיר סיטונאי, לפני מע״מ'}`
    : '';
  $('#grid').innerHTML = list.length ? list.map(p=>{
    const price = state.mode==='cons' ? p.cons : p.ws;
    const low = p.stock <= 3;
    return `<article class="card">
      <div class="imgwrap">
        ${low ? `<span class="tag low">נותרו ${p.stock}</span>` : ''}
        <img src="${p.img}" alt="${p.name}" loading="lazy">
      </div>
      <div class="body">
        <div class="brand">${p.brand}</div>
        <h3 class="name">${p.name}</h3>
        ${p.sub ? `<div class="sub">${p.sub}</div>` : ''}
        <div class="foot">
          <div class="price">₪${fmt(price)}<small>${state.mode==='cons'?'':'+ מע״מ'}</small></div>
          <div class="stock ${low?'low':''}">${p.stock} במלאי</div>
        </div>
      </div>
    </article>`;
  }).join('') : `<p class="none">אין מוצר שעונה על הסינון הזה.</p>`;
}

$('#q').addEventListener('input', e=>{ state.q = e.target.value; render(); });
$('#brand').addEventListener('change', e=>{ state.brand = e.target.value; render(); });
$('#sort').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
[['#mCons','cons'],['#mWs','ws']].forEach(([sel,mode])=>{
  $(sel).addEventListener('click', ()=>{
    state.mode = mode;
    $('#mCons').setAttribute('aria-pressed', String(mode==='cons'));
    $('#mWs').setAttribute('aria-pressed', String(mode==='ws'));
    render();
  });
});

chips();
render();
</script>
